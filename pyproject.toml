[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owrt-monitor"
version = "0.1.0"
description = "OpenWrt build, firmware artifact, DUT upgrade, and test orchestration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "owrt_monitor contributors" }
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
serial = [
  "pexpect>=4.9",
  "pyserial>=3.5",
]

[project.scripts]
owrt-monitor = "owrt_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

