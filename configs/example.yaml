project:
  name: owrt-monitor-lab
  artifact_dir: ../artifacts

builder:
  container: openwrt-builder
  workdir: /work/openwrt
  command:
    - make
    - -j8
  env:
    FORCE_UNSAFE_CONFIGURE: "1"
  timeout_sec: 0

artifact:
  patterns:
    - bin/targets/**/**/openwrt-*-sysupgrade.bin
  selection: newest
  min_size_mb: 4
  require_sha256: true

dut:
  name: dut-01
  serial: /dev/cu.usbserial-0001
  baud: 115200
  prompt: "root@OpenWrt:.*# "
  newline: lf
  connect_timeout_sec: 30
  command_timeout_sec: 30
  discovery_patterns:
    - /dev/cu.usbserial-*
    - /dev/tty.usbserial-*
    - /dev/cu.usbmodem*
    - /dev/tty.usbmodem*
  login:
    username: root
  network:
    address: 192.168.1.1
    interface: br-lan

upgrade:
  transfer: http
  remote_path: /tmp/firmware.bin
  command: sysupgrade -n /tmp/firmware.bin
  boot_timeout_sec: 240
  transfer_timeout_sec: 180
  http_bind: 0.0.0.0
  http_host: null
  http_port: 0
  verify_sha256: true

tests:
  command_timeout_sec: 30
  smoke:
    - ubus call system board
    - opkg list-installed
    - /etc/init.d/network status
